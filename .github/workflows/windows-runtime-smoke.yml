name: Windows portable runtime smoke

on:
  push:
    branches: [ci/windows-runtime-smoke]

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Download the approved Windows x64 package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42191842054 --repo "$env:GITHUB_REPOSITORY" --name desk-rule-windows-x64 --dir artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $zip = 'artifact/desk-rule-windows-x64.zip'
          if ((Get-FileHash -Algorithm SHA256 $zip).Hash -ne '30ed253d1230f9f8acc0cbbfd0c6a46267836bbf75162a65234e8b54ddb53d62') {
            throw 'Windows package does not match the verified artifact.'
          }
          Expand-Archive $zip -DestinationPath artifact
      - name: Start Desk Rule and exercise local sharing
        shell: pwsh
        run: |
          @'
          import os
          from pathlib import Path
          import socket
          import subprocess
          import time

          def read_exact(peer, count):
              data = bytearray()
              while len(data) < count:
                  part = peer.recv(count - len(data))
                  if not part:
                      raise EOFError("Desk Rule closed before finishing the frame")
                  data.extend(part)
              return bytes(data)

          def read_frame(peer):
              first = read_exact(peer, 1)
              width = (first[0] & 3) + 1
              header = first + read_exact(peer, width - 1)
              length = int.from_bytes(header, "little") >> 2
              assert 0 < length < 4096, length
              return read_exact(peer, length)

          def can_connect():
              try:
                  with socket.create_connection(("127.0.0.1", 21118), timeout=0.5):
                      return True
              except OSError:
                  return False

          folder = Path("artifact/desk-rule-windows-x64").resolve()
          exe = folder / "desk-rule.exe"

          def launch():
              return subprocess.Popen([str(exe)], cwd=folder)

          def stop(app):
              if app.poll() is None:
                  app.terminate()
                  app.wait(timeout=10)

          app = launch()
          try:
              deadline = time.monotonic() + 25
              while True:
                  assert app.poll() is None, f"Desk Rule exited during startup: {app.returncode}"
                  try:
                      with open(r"\\.\pipe\desk-rule\query", "r+b", buffering=0):
                          break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(0.25)
              assert not can_connect(), "port accepted a connection while sharing was off"
              print("Windows process and local IPC started; sharing defaults to off.")
          finally:
              stop(app)

          config = Path(os.environ["APPDATA"]) / "desk-rule" / "config" / "desk-rule2.toml"
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text('[options]\nstop-service = "N"\n', encoding="utf-8")
          app = launch()
          try:
              deadline = time.monotonic() + 25
              while True:
                  assert app.poll() is None, f"Desk Rule exited with sharing enabled: {app.returncode}"
                  try:
                      peer = socket.create_connection(("127.0.0.1", 21118), timeout=2)
                      break
                  except OSError:
                      if time.monotonic() >= deadline:
                          raise
                      time.sleep(0.2)
              with peer:
                  peer.settimeout(5)
                  assert read_frame(peer)[0] == 0x1a, "first TCP message is not SignedId"
              print("Windows direct listener sent its signed identity on TCP 21118.")
          finally:
              stop(app)
          assert not can_connect(), "listener stayed open after the app exited"
          print("Windows direct listener closed when Desk Rule exited.")
          '@ | Set-Content -Encoding utf8 smoke.py
          python smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
