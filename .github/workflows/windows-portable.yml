name: Desk Rule for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Prepare Rust and vcpkg
        shell: pwsh
        run: |
          rustup default stable-x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vcpkg = Join-Path $env:RUNNER_TEMP 'desk-rule-vcpkg'
          git init $vcpkg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkg fetch --depth 1 https://github.com/microsoft/vcpkg.git 9e593bb18ea69cc5095e012465dcd675a822ed0d
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $vcpkg checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $vcpkg 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$vcpkg" >> $env:GITHUB_ENV
      - name: Build Windows portable package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desk-rule-windows-x64
          path: target/windows-portable/desk-rule-windows-x64.zip
          if-no-files-found: error
