name: Desk Rule Android

on:
  push:
    branches: [android-core]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore the existing Flutter bridge
        run: |
          echo 'b24fe8739d3d7bb74a3a167653cdda6acf0a6b65ae3e485421e248812627f3e8  res/flutter-bridge.zip' | sha256sum --check
          python3 -m zipfile -e res/flutter-bridge.zip .
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - name: Resolve Flutter packages
        working-directory: flutter
        run: flutter pub get
      - name: Check the Android core UI
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/common/widgets/desk_rule_home.dart lib/main.dart lib/models/server_model.dart
      - name: Test address formatting and input modifiers
        working-directory: flutter
        run: flutter test test/id_formatter_test.dart test/input_modifier_utils_test.dart test/desk_rule_sharing_test.dart

  apk-arm64:
    needs: flutter-check
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Restore the existing Flutter bridge
        run: |
          echo 'b24fe8739d3d7bb74a3a167653cdda6acf0a6b65ae3e485421e248812627f3e8  res/flutter-bridge.zip' | sha256sum --check
          python3 -m zipfile -e res/flutter-bridge.zip .
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.24.5
          cache: true
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
      - name: Prepare native tools and codecs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang libclang-dev cmake ninja-build nasm pkg-config libssl-dev
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 3.1.2 --locked
          vcpkg_root="$RUNNER_TEMP/desk-rule-vcpkg"
          git init "$vcpkg_root"
          git -C "$vcpkg_root" fetch --depth 1 https://github.com/microsoft/vcpkg.git 9e593bb18ea69cc5095e012465dcd675a822ed0d
          git -C "$vcpkg_root" checkout --detach FETCH_HEAD
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics
          "$vcpkg_root/vcpkg" install --classic --triplet arm64-android --overlay-ports="$GITHUB_WORKSPACE/res/vcpkg" --overlay-triplets="$GITHUB_WORKSPACE/res/vcpkg-triplets" libvpx libyuv aom opus cpu-features libjpeg-turbo
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
      - name: Build the native Android core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          cargo ndk --bindgen --platform 22 --target aarch64-linux-android build --locked --release --lib --features flutter
          output=flutter/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$output"
          cp target/aarch64-linux-android/release/liblibrustdesk.so "$output/librustdesk.so"
          cp "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" "$output/"
      - name: Build an installable test APK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/' flutter/android/app/build.gradle
          cd flutter
          flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Verify the APK identity, permissions and signature
        run: |
          apk=flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$aapt" dump badging "$apk" | grep "package: name='org.desk_rule.android'"
          "$aapt" dump permissions "$apk" > "$RUNNER_TEMP/desk-rule-permissions.txt"
          if grep -E 'android.permission.(CAMERA|RECORD_AUDIO|FOREGROUND_SERVICE_MICROPHONE)' "$RUNNER_TEMP/desk-rule-permissions.txt"; then
            echo "Unexpected camera or audio permission in the core-only APK" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          mkdir -p dist
          cp "$apk" dist/desk-rule-android-arm64-test.apk
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desk-rule-android-arm64-test
          path: dist/desk-rule-android-arm64-test.apk
          if-no-files-found: error
